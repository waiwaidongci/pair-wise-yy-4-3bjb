<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录 · 出水晾护交接台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 12px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    label.check { display: flex; gap: 8px; align-items: center; color: #183035; }
    label.check input { width: auto; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; }
    .left { display: grid; gap: 16px; align-content: start; min-width: 0; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .panel-lite { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; margin: 8px 0; display: grid; gap: 4px; }
    .map { position: relative; height: clamp(340px, 52vh, 620px); overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .muted { color: #5c7378; font-size: 13px; }
    .head-right { display: flex; gap: 14px; align-items: center; }
    .clock { font-weight: 800; color: #1d6c78; font-variant-numeric: tabular-nums; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; background: #e3eef0; color: #28525a; padding: 9px 6px; }
    .tabs button.active { background: #1d6c78; color: #fff; }
    .rows { display: grid; gap: 8px; margin-bottom: 12px; max-height: 280px; overflow: auto; }
    #archiveList { max-height: 460px; }
    .row { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; display: grid; gap: 4px; }
    .row.risk { border-color: #d98880; background: #fdf1ef; }
    .row.plain { cursor: default; }
    .time { font-weight: 800; }
    .time.overdue { color: #b03a2e; }
    .time.soon { color: #b9770e; }
    .risk-text { color: #b03a2e; font-weight: 700; }
    .care { border: 1px dashed #9fc3c8; border-radius: 8px; margin: 10px 0; padding: 10px; }
    .care legend { color: #5c7378; font-size: 13px; padding: 0 6px; }
    .seg { border-left: 3px solid #1d6c78; padding: 3px 8px; margin: 4px 0; font-size: 13px; }
    .seg.hand { border-left-color: #b9770e; }
    .msg { min-height: 20px; font-weight: 700; margin-top: 8px; }
    .msg.error { color: #b03a2e; }
    .msg.ok { color: #1e8449; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 420px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录 · 出水晾护交接台</h1><div class="muted">点击平面图添加标记；出水后在「登记」记录出水时刻、含水率与容器，「交接」核对容器与上一步时间，待办按剩余时限排序。</div></div>
    <div class="head-right"><div class="clock" id="clock"></div><button id="exportBtn">导出JSON</button></div>
  </header>
  <main class="app">
    <section class="left">
      <div class="panel"><div class="map" id="map"><div class="wreck"></div></div></div>
      <div class="panel">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </div>
    </section>
    <aside class="panel">
      <nav class="tabs">
        <button data-tab="board" class="active">待办</button>
        <button data-tab="register">登记</button>
        <button data-tab="handover">交接</button>
        <button data-tab="archive">档案</button>
      </nav>

      <section id="tab-board" class="tabpage">
        <h2>风险清单 <span id="riskCount" class="pill"></span></h2>
        <div id="riskList" class="rows"></div>
        <h2>待办（按剩余时限） <span id="todoCount" class="pill"></span></h2>
        <div id="todoList" class="rows"></div>
        <div class="muted">规则：木质件离水30分钟内入保湿箱；陶片含水率＞18%先阴干，勿入恒湿柜。点击条目转交接处理。</div>
      </section>

      <section id="tab-register" class="tabpage" hidden>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <fieldset class="care">
            <legend>出水晾护登记</legend>
            <label class="check" id="surfacedRow"><input type="checkbox" name="surfaced"> 已出水，登记晾护信息</label>
            <div id="careInputs" hidden>
              <div class="muted">材质以「类型」为准；登记后按规则进入待办与风险判定。</div>
              <label>出水时刻</label><input name="outAt" type="datetime-local">
              <label>含水率（%）</label><input name="moisture" type="number" min="0" max="100" step="0.1" placeholder="例如 21.5">
              <label>当前容器</label><select name="container"></select>
              <label>经手人</label><input name="keeper" placeholder="选填">
            </div>
            <div id="careLocked" class="muted" hidden>该标记已建立晾护档案；换容器、复测含水率请使用「交接」页，历史容器段会保留。</div>
          </fieldset>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
        </form>
      </section>

      <section id="tab-handover" class="tabpage" hidden>
        <h2>保管员交接</h2>
        <label>选择出水件</label>
        <select id="handoverPick"></select>
        <div id="handoverInfo" class="panel-lite" hidden></div>
        <form id="handoverForm" hidden>
          <label>保管员</label><input name="keeper" required placeholder="接手人姓名">
          <label class="check"><input type="checkbox" name="confirmedContainer"> <span>已核对当前容器：<b id="hkContainer"></b></span></label>
          <label class="check"><input type="checkbox" name="confirmedPrevAt"> <span>已核对上一步时间：<b id="hkPrevAt"></b></span></label>
          <label>换容器（默认保持不变）</label><select name="newContainer"></select>
          <label>复测含水率（%，可选）</label><input name="moisture" type="number" min="0" max="100" step="0.1">
          <label>备注</label><textarea name="note"></textarea>
          <button>确认交接</button>
        </form>
        <div id="handoverMsg" class="msg"></div>
      </section>

      <section id="tab-archive" class="tabpage" hidden>
        <h2>晾护档案</h2>
        <div id="archiveList" class="rows"></div>
      </section>
    </aside>
  </main>
  <script src="js/rules.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
